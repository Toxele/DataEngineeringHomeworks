apiVersion: v1
kind: Pod
metadata:
  name: priority-low
  namespace: hw5
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 1
  containers:
  - name: task
    image: skill-pairs:hw5
    imagePullPolicy: Never
    command:
    - python
    - -c
    - 'import time

      time.sleep(600)'
    resources:
      requests:
        cpu: '7'
        memory: 32Mi
      limits:
        cpu: '7'
        memory: 64Mi
  priorityClassName: hw5-low
